name: 配置 Android 构建环境
description: 从仓库配置读取 JDK、SDK、NDK 和 CMake 版本
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - id: versions
      shell: bash
      run: python tools/ci/android_ci_config.py --output "$GITHUB_OUTPUT"
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: ${{ steps.versions.outputs.java }}
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      with:
        cache-provider: basic
        cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_type == 'tag' }}
    - name: 安装仓库指定的 Android 工具
      shell: bash
      run: |
        task_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$task_sdk"
        task_tools="$task_sdk/cmdline-tools/latest/bin"
        test -x "$task_tools/sdkmanager"
        # Runner 预装 SDK 不保证命令行工具位于 PATH；同时配置当前步骤和后续步骤。
        echo "$task_tools" >> "$GITHUB_PATH"
        echo "$task_sdk/platform-tools" >> "$GITHUB_PATH"
        export PATH="$task_tools:$task_sdk/platform-tools:$PATH"
        set +o pipefail
        yes | sdkmanager --licenses > /dev/null
        set -o pipefail
        # 旧 avdmanager 将 android-37.0 写成 android-0；固定版本并保留 Runner 原工具目录。
        task_cmdline_version="${{ steps.versions.outputs.cmdline-tools }}"
        sdkmanager --install "cmdline-tools;$task_cmdline_version"
        test -x "$task_sdk/cmdline-tools/$task_cmdline_version/bin/avdmanager"
        test ! -e "$task_sdk/cmdline-tools/fetchkit-runner-original"
        mv "$task_sdk/cmdline-tools/latest" "$task_sdk/cmdline-tools/fetchkit-runner-original"
        ln -s "$task_sdk/cmdline-tools/$task_cmdline_version" "$task_sdk/cmdline-tools/latest"
        python tools/ci/android_ci_config.py --install
        test -x "$JAVA_HOME/bin/jlink"
        mkdir -p build/ci
        sdkmanager --version > build/ci/cmdline-tools-version.txt
        grep -Fx "$task_cmdline_version" build/ci/cmdline-tools-version.txt
        java -version 2> build/ci/java-version.txt
        ./gradlew --version > build/ci/gradle-version.txt
